<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c8dc">
  <title>Japanese Sentence Drill</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
<style>.menu-anchor{position:relative;z-index:10;flex-shrink:0}.menu-popover{position:absolute;top:calc(100% + 10px);left:0;min-width:170px;padding:8px;background:#cdefff;border:3px solid #161616;border-radius:16px;box-shadow:4px 4px 0 #161616}.menu-popover[hidden]{display:none}.menu-popover a{display:block;padding:10px;color:#161616;text-decoration:none;font-weight:800}.top-controls{align-items:center}.progress-wrap{min-height:60px}</style></head>
<body>
  <main class="app-shell">

    <section class="top-card">
      <p class="eyebrow">Japanese sentence drill</p>
      <h1 id="levelTitle">Choose a set</h1>

      <div class="top-controls"><div class="menu-anchor"><button id="menuToggle" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav id="menuPopover" class="menu-popover" hidden><a href="https://lushr.github.io/jp-conj-audio/">⌂ Main menu</a></nav></div>
        <div class="level-picker" id="levelPicker" aria-label="Choose a practice set">
          <button class="level-button" type="button" data-level-index="0">A</button>
          <button class="level-button" type="button" data-level-index="1">B</button>
          <button class="level-button" type="button" data-level-index="2">C</button>
          <button class="level-button" type="button" data-level-index="3">D</button>
          <button class="level-button" type="button" data-level-index="4">E</button>
          <button class="level-button" type="button" data-level-index="5">F</button>
        </div>

        
      </div>

      <div class="progress-wrap" aria-label="Progress">
        <div class="progress-label">
          <span><i class="bi bi-bar-chart-line"></i> Progress</span>
          <span id="progressText">0 / 0</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
    </section>

    <section class="prompt-card" aria-live="polite">
      <div class="chip-row" id="chipRow"></div>
      <p class="prompt-label"><i class="bi bi-translate"></i> English prompt</p>
      <h2 id="englishPrompt">Loading...</h2>
    </section>

    <section id="answerCard" class="answer-card hidden" aria-live="polite">
      <p class="answer-label"><i class="bi bi-eye"></i> Japanese answer</p>
      <p id="japaneseAnswer" class="japanese-text"></p>
      <p id="noteText" class="note-text"></p>
      <button id="nextButton" class="primary-button yellow" type="button">
        <i class="bi bi-arrow-right-circle"></i> Next sentence
      </button>
    </section>

    <button id="revealButton" class="primary-button pink" type="button">
      <i class="bi bi-eye"></i> Reveal answer
    </button>
  </main>

  <script src="script.js"></script>
<script>const menuButton=document.getElementById('menuToggle'),menuPanel=document.getElementById('menuPopover');menuButton.addEventListener('click',()=>{menuPanel.hidden=!menuPanel.hidden;menuButton.setAttribute('aria-expanded',String(!menuPanel.hidden))});document.addEventListener('pointerdown',event=>{if(!menuButton.parentElement.contains(event.target)){menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false')}});</script></body>
</html>
